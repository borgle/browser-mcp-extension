name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CRX_PRIVATE_KEY_BASE64: ${{ secrets.CRX_PRIVATE_KEY_BASE64 }}
      CRX_PUBLIC_KEY_BASE64: ${{ secrets.CRX_PUBLIC_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check syntax
        run: npm run syntax

      - name: Validate release version
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version v${version}" >&2
            exit 1
          fi

      - name: Validate signing secrets
        shell: bash
        run: |
          if [[ -z "${CRX_PRIVATE_KEY_BASE64}" ]]; then
            echo "Repository secret CRX_PRIVATE_KEY_BASE64 is required." >&2
            exit 1
          fi
          if [[ -z "${CRX_PUBLIC_KEY_BASE64}" ]]; then
            echo "Repository secret CRX_PUBLIC_KEY_BASE64 is required." >&2
            exit 1
          fi

      - name: Package minified ZIP and signed CRX
        shell: bash
        run: |
          key_path="${RUNNER_TEMP}/abm-extension-private.pem"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$CRX_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          CRX_KEY_PATH="$key_path" node scripts/package-extension.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: abm-browser-extension
          path: |
            build/*.zip
            build/*.crx
            build/*.sha256

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file="${RUNNER_TEMP}/abm-release-notes.md"
          manual_notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$manual_notes" ]]; then
            cp "$manual_notes" "$notes_file"
          else
            previous_tag="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [[ -n "$previous_tag" ]]; then
              gh api "repos/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/abm-commits.json"
            else
              gh api "repos/${GITHUB_REPOSITORY}/commits?sha=${GITHUB_REF_NAME}&per_page=100" > "${RUNNER_TEMP}/abm-commits.json"
            fi
            args=(--input "${RUNNER_TEMP}/abm-commits.json" --repository "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}")
            if [[ -n "$previous_tag" ]]; then
              args+=(--previous-tag "$previous_tag")
            fi
            node scripts/release-notes.mjs "${args[@]}" > "$notes_file"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          gh release create "$GITHUB_REF_NAME" \
            "build/abm-browser-extension-${version}.zip" \
            "build/abm-browser-extension-${version}.crx" \
            "build/abm-browser-extension-${version}.sha256" \
            --title "ABM Browser Extension v${version}" \
            --notes-file "${RUNNER_TEMP}/abm-release-notes.md"

